<script>
(() => {
'use strict';
// ================= 基本 =================
const BW = 240, BH = 176, TS = 16;
const cvs = document.getElementById('game');
const ctx = cvs.getContext('2d');
const lo = document.createElement('canvas'); lo.width = BW; lo.height = BH;
const lx = lo.getContext('2d'); lx.imageSmoothingEnabled = false;
const FONT = '"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans CJK JP","Noto Sans JP","Yu Gothic","Meiryo",sans-serif';
const qs = new URLSearchParams(location.search);
const isTouch = qs.has('touch') || ('ontouchstart' in window) || navigator.maxTouchPoints > 0 ||
  (window.matchMedia && matchMedia('(pointer:coarse)').matches);
const rnd = Math.random;
const ri = (a, b) => a + Math.floor(rnd() * (b - a + 1));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
let S = 1; // 実ピクセル / ゲームピクセル
let frame = 0;

// ================= レイアウト（縦・横どちらでも全画面フィット） =================
const ctrl = document.getElementById('ctrl'), dpad = document.getElementById('dpad');

function layout() {

  const sr = saEl.getBoundingClientRect();

      ah = vh - T - B - ctrlH - 8;
      pad = clamp(Math.min(vw * 0.46, ctrlH * 0.82), 130, 210);
      btn = clamp(pad * 0.43, 60, 92);
      const cy = T + 4 + ah + (ctrlH - 4) / 2;
      place(dpad, L + clamp(vw * 0.05, 12, 30), cy - pad / 2, pad, pad);
      const rx = vw - R - clamp(vw * 0.05, 12, 30);
      place(btnA, rx - btn, cy - btn * 0.95, btn, btn);
      place(btnB, rx - btn * 2.15, cy - btn * 0.05, btn, btn);
    } else {
      const side = clamp(Math.round(vw * 0.22), 130, 250);
      ax = L + side; aw = vw - L - R - side * 2;
      pad = clamp(Math.min(side - 14, vh * 0.52), 110, 200);
      btn = clamp(pad * 0.45, 54, 88);
      const by = vh - B - Math.max(10, vh * 0.06);
      place(dpad, L + (side - pad) / 2, by - pad, pad, pad);
      const rx = vw - R - (side - btn * 2.15) / 2;
      place(btnA, rx - btn, by - btn * 2.0, btn, btn);
      place(btnB, rx - btn * 2.15, by - btn * 1.05, btn, btn);
    }
    dpad.querySelectorAll('.arr').forEach(e => e.style.fontSize = Math.round(pad * 0.12) + 'px');
    [btnA, btnB].forEach(e => { e.style.fontSize = Math.round(btn * 0.36) + 'px'; e.querySelector('small').style.fontSize = Math.round(btn * 0.17) + 'px'; });
  }
  const fit = Math.max(0.5, Math.min(aw / BW, ah / BH));
  let dev = fit * dpr;
  const di = Math.floor(dev);
  if (di >= 2 && di / dev >= 0.86) dev = di; // 整数倍が近ければ整数倍に（ドットを均一に）
  const css = dev / dpr;
  const cw = BW * css, ch = BH * css;
  const left = Math.round((ax + (aw - cw) / 2) * dpr) / dpr, top = Math.round((ay + (ah - ch) / 2) * dpr) / dpr;
  cvs.style.width = cw + 'px'; cvs.style.height = ch + 'px';
  cvs.style.left = left + 'px'; cvs.style.top = top + 'px';
  cvs.width = Math.round(BW * dev); cvs.height = Math.round(BH * dev);
  S = cvs.width / BW;
}
function place(el, x, y, w, h) { Object.assign(el.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' }); }
window.addEventListener('resize', layout);
window.addEventListener('orientationchange', () => setTimeout(layout, 150));
if (window.visualViewport) visualViewport.addEventListener('resize', layout);

// ================= 入力 =================
const BTN = ['up', 'down', 'left', 'right', 'a', 'b'];
const held = {}, latch = {}, holdT = {}, inp = { p: {} };
BTN.forEach(b => { held[b] = false; latch[b] = false; holdT[b] = 0; inp.p[b] = false; });
let dirOrder = [];
function press(b) { if (!held[b]) latch[b] = true; held[b] = true; if (b.length > 1 && !dirOrder.includes(b)) dirOrder.push(b); }
function release(b) { held[b] = false; dirOrder = dirOrder.filter(d => d !== b); }
function rep(b) { if (inp.p[b]) return true; const t = holdT[b]; return held[b] && t > 18 && (t - 18) % 6 === 0; }
function curDir() { return dirOrder.length ? dirOrder[dirOrder.length - 1] : null; }
function beginFrame() { BTN.forEach(b => { inp.p[b] = latch[b]; latch[b] = false; holdT[b] = held[b] ? holdT[b] + 1 : 0; }); }
const KEYMAP = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', KeyW: 'up', KeyS: 'down', KeyA: 'left', KeyD: 'right',
  KeyZ: 'a', Enter: 'a', Space: 'a', KeyX: 'b', Escape: 'b', Backspace: 'b' };
window.addEventListener('keydown', e => { const b = KEYMAP[e.code]; if (b) { e.preventDefault(); if (!e.repeat) press(b); } });
window.addEventListener('keyup', e => { const b = KEYMAP[e.code]; if (b) { e.preventDefault(); release(b); } });
window.addEventListener('blur', () => BTN.forEach(release));

// --- タッチ：スクロール/バウンス/ダブルタップズーム/長押し選択を全部止める ---
const stop = e => { if (e.cancelable) e.preventDefault(); };
['touchstart', 'touchmove', 'touchend', 'touchcancel'].forEach(t => document.addEventListener(t, stop, { passive: false }));
['gesturestart', 'gesturechange', 'gestureend', 'dblclick', 'contextmenu', 'selectstart', 'dragstart'].forEach(t => document.addEventListener(t, stop, { passive: false }));

// --- 十字キー（指をすべらせて方向転換OK） ---
const arrEls = { up: dpad.querySelector('.u'), down: dpad.querySelector('.d'), left: dpad.querySelector('.l'), right: dpad.querySelector('.r') };
let padTouch = null, padDir = null;
function setPadDir(d) {
  if (d === padDir) return;
  if (padDir) { release(padDir); arrEls[padDir].classList.remove('on'); }
  padDir = d;
  if (d) { press(d); arrEls[d].classList.add('on'); buzz(6); }
}
function padPoint(x, y) {
  const r = dpad.getBoundingClientRect();
  const dx = x - (r.left + r.width / 2), dy = y - (r.top + r.height / 2);
  if (Math.hypot(dx, dy) < r.width * 0.12) return setPadDir(null);
  setPadDir(Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? 'left' : 'right') : (dy < 0 ? 'up' : 'down'));
}
dpad.addEventListener('touchstart', e => { const t = e.changedTouches[0]; padTouch = t.identifier; padPoint(t.clientX, t.clientY); }, { passive: false });
dpad.addEventListener('touchmove', e => { for (const t of e.changedTouches) if (t.identifier === padTouch) padPoint(t.clientX, t.clientY); }, { passive: false });
const padEnd = e => { for (const t of e.changedTouches) if (t.identifier === padTouch) { padTouch = null; setPadDir(null); } };
dpad.addEventListener('touchend', padEnd, { passive: false }); dpad.addEventListener('touchcancel', padEnd, { passive: false });
let mouseOnPad = false;
dpad.addEventListener('mousedown', e => { mouseOnPad = true; padPoint(e.clientX, e.clientY); });
window.addEventListener('mousemove', e => { if (mouseOnPad) padPoint(e.clientX, e.clientY); });
window.addEventListener('mouseup', () => { if (mouseOnPad) { mouseOnPad = false; setPadDir(null); } });
// --- A / B ---
function bindBtn(el, b) {
  const down = () => { el.classList.add('on'); press(b); buzz(10); };
  const up = () => { el.classList.remove('on'); release(b); };
  el.addEventListener('touchstart', down, { passive: false });
  el.addEventListener('touchend', up, { passive: false });
  el.addEventListener('touchcancel', up, { passive: false });
  el.addEventListener('mousedown', down); el.addEventListener('mouseup', up); el.addEventListener('mouseleave', up);
}
bindBtn(btnA, 'a'); bindBtn(btnB, 'b');
// --- 画面タップ（メニュー/コマンドを直接タップ） ---
let hits = [];
function addHit(x, y, w, h, fn) { hits.push({ x, y, w, h, fn }); }
function canvasTap(cx, cy) {
  const r = cvs.getBoundingClientRect();
  const x = (cx - r.left) / r.width * BW, y = (cy - r.top) / r.height * BH;
  for (let i = hits.length - 1; i >= 0; i--) {
    const h = hits[i];
    if (x >= h.x && x < h.x + h.w && y >= h.y && y < h.y + h.h) { hits = []; buzz(8); h.fn(); return; }
  }
  if (scene === 'battle' || scene === 'ending') latch.a = true;
}
cvs.addEventListener('touchstart', e => { const t = e.changedTouches[0]; canvasTap(t.clientX, t.clientY); }, { passive: false });
cvs.addEventListener('mousedown', e => canvasTap(e.clientX, e.clientY));

// ================= サウンド（最初のタッチで解錠） =================
const AC = window.AudioContext || window.webkitAudioContext;
let ac = null, master = null, muted = false, noiseBuf = null;
function unlockAudio() {
  if (!AC) return;
  try {
    if (!ac) {
      ac = new AC(); master = ac.createGain(); master.gain.value = muted ? 0 : 0.6; master.connect(ac.destination);
      noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (ac.state !== 'running') ac.resume();
    const s = ac.createBufferSource(); s.buffer = ac.createBuffer(1, 1, 22050); s.connect(ac.destination); s.start(0); // iOS 解錠
    if (bgmWant && !bgmName) playBGM(bgmWant);
  } catch (e) {}
}
['touchstart', 'touchend', 'pointerdown', 'mousedown', 'keydown'].forEach(t => window.addEventListener(t, unlockAudio, { capture: true, passive: true }));
document.addEventListener('visibilitychange', () => { if (!ac) return; if (document.hidden) ac.suspend(); else ac.resume(); });
const midi = m => 440 * Math.pow(2, (m - 69) / 12);
function tone(f, t, d, type = 'square', v = 0.08, dest, f2) {
  if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(dest || master); o.start(t); o.stop(t + d + 0.03);
}
function noise(t, d, v = 0.2, freq = 1200) {
  if (!ac) return;
  const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  s.buffer = noiseBuf; f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 0.7;
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + d + 0.02);
}
function seq(notes, bpm = 150, type = 'square', v = 0.07) {
  if (!ac) return; let t = ac.currentTime + 0.02; const e = 60 / bpm / 2;
  for (const [m, d] of notes) { if (m) tone(midi(m), t, d * e * 0.92, type, v); t += d * e; }
}
function sfx(n) {
  if (!ac || muted) return; const t = ac.currentTime + 0.005;
  switch (n) {
    case 'cur': tone(1250, t, 0.035, 'square', 0.035); break;
    case 'blip': tone(820, t, 0.02, 'square', 0.018); break;
    case 'ok': tone(880, t, 0.05, 'square', 0.06); tone(1320, t + 0.05, 0.07, 'square', 0.06); break;
    case 'cancel': tone(620, t, 0.05, 'square', 0.05); tone(420, t + 0.05, 0.07, 'square', 0.05); break;
    case 'bump': tone(110, t, 0.07, 'square', 0.05); break;
    case 'swing': noise(t, 0.09, 0.12, 3000); break;
    case 'hit': noise(t, 0.14, 0.3, 900); tone(240, t, 0.12, 'square', 0.08, null, 60); break;
    case 'crit': noise(t, 0.25, 0.4, 700); tone(500, t, 0.25, 'sawtooth', 0.1, null, 50); break;
    case 'hurt': tone(320, t, 0.28, 'sawtooth', 0.1, null, 45); noise(t, 0.2, 0.2, 500); break;
    case 'miss': tone(500, t, 0.12, 'triangle', 0.06, null, 260); break;
    case 'heal': [72, 76, 79, 84].forEach((m, i) => tone(midi(m), t + i * 0.06, 0.18, 'sine', 0.09)); break;
    case 'fire': noise(t, 0.45, 0.25, 1500); tone(180, t, 0.4, 'sawtooth', 0.07, null, 900); break;
    case 'thunder': noise(t, 0.6, 0.45, 400); tone(90, t, 0.5, 'square', 0.1, null, 40); break;
    case 'breath': noise(t, 0.8, 0.35, 700); tone(120, t, 0.8, 'sawtooth', 0.1, null, 60); break;
    case 'enc': for (let i = 0; i < 3; i++) tone(220, t + i * 0.12, 0.11, 'square', 0.06, null, 1400); break;
    case 'run': [76, 72, 67, 60].forEach((m, i) => tone(midi(m), t + i * 0.05, 0.06, 'square', 0.05)); break;
    case 'door': tone(600, t, 0.25, 'square', 0.05, null, 150); break;
    case 'chest': [67, 71, 74, 79, 83].forEach((m, i) => tone(midi(m), t + i * 0.07, 0.12, 'square', 0.05)); break;
    case 'win': seq([[72, 1], [72, 1], [72, 1], [72, 3], [68, 3], [70, 3], [72, 2], [70, 1], [72, 6]], 190, 'square', 0.07); break;
    case 'lvup': seq([[67, 1], [72, 1], [76, 1], [79, 2], [76, 1], [79, 5]], 200, 'square', 0.08); break;
    case 'inn': seq([[72, 2], [76, 2], [79, 2], [84, 4], [79, 2], [84, 6]], 120, 'triangle', 0.12); break;
    case 'dead': seq([[64, 2], [63, 2], [62, 2], [61, 6]], 110, 'triangle', 0.12); break;
  }
}
// --- BGM シーケンサ ---
const SONGS = {
  field: { bpm: 132, mel: [[67,2],[72,2],[76,3],[74,1],[72,2],[71,2],[69,4],[65,2],[69,2],[72,3],[71,1],[69,2],[67,2],[64,4],
    [67,2],[72,2],[76,3],[77,1],[79,2],[77,2],[76,2],[74,2],[72,2],[74,2],[71,2],[67,2],[72,8]], bass: [48,45,41,43,48,41,43,48], mode: 'walk' },
  battle: { bpm: 172, mel: [[69,1],[72,1],[76,1],[72,1],[69,1],[72,1],[76,1],[79,1],[77,1],[76,1],[74,1],[72,1],[74,2],[71,2],
    [69,1],[72,1],[76,1],[72,1],[69,1],[72,1],[76,1],[81,1],[80,2],[76,2],[71,2],[68,2]], bass: [45,41,45,40], mode: 'pulse' },
  boss: { bpm: 186, mel: [[64,1],[64,1],[76,1],[64,1],[75,1],[64,1],[74,1],[73,1],[72,2],[71,2],[70,2],[69,2],
    [64,1],[64,1],[76,1],[64,1],[77,1],[64,1],[79,1],[77,1],[76,2],[75,2],[76,4]], bass: [40,40,41,40], mode: 'pulse' },
  cave: { bpm: 84, mel: [[62,4],[65,4],[69,6],[67,2],[65,4],[64,4],[62,8],[0,4],[58,4],[62,4],[65,4],[64,8],[61,8]], bass: [38,38,34,34,36,36,33,33], mode: 'long' },
  ending: { bpm: 104, mel: [[72,4],[71,2],[72,2],[74,4],[76,4],[77,4],[76,2],[74,2],[72,8],[69,4],[71,2],[72,2],[74,4],[71,4],[72,12],[0,4]], bass: [48,43,41,48,45,43,48,48], mode: 'long' },
};
let bgmName = null, bgmWant = null, tracks = null, bgmGain = null;
function bassNotes(s) {
  const out = [];
  for (const r of s.bass) {
    if (s.mode === 'walk') out.push([r, 2], [r + 7, 2], [r + 12, 2], [r + 7, 2]);
    else if (s.mode === 'pulse') for (let i = 0; i < 8; i++) out.push([i % 2 ? r + 12 : r, 1]);
    else out.push([r, 8]);
  }
  return out;
}
function playBGM(n) {
  bgmWant = n;
  if (!ac || bgmName === n) return;
  stopBGM(true); bgmWant = n; bgmName = n;
  const s = SONGS[n]; const e8 = 60 / s.bpm / 2; const st = ac.currentTime + 0.12;
  bgmGain = ac.createGain(); bgmGain.gain.value = 1; bgmGain.connect(master);
  tracks = [{ notes: s.mel, i: 0, t: st, type: 'square', v: 0.045, e8 }, { notes: bassNotes(s), i: 0, t: st, type: 'triangle', v: 0.1, e8 }];
}
function stopBGM(keepWant) {
  if (!keepWant) bgmWant = null;
  bgmName = null; tracks = null;
  if (bgmGain && ac) { const g = bgmGain; g.gain.setValueAtTime(g.gain.value, ac.currentTime); g.gain.linearRampToValueAtTime(0, ac.currentTime + 0.12); setTimeout(() => g.disconnect(), 400); }
  bgmGain = null;
}
setInterval(() => {
  if (!ac || !tracks || ac.state !== 'running') return;
  const now = ac.currentTime, ahead = now + 0.3;
  for (const tr of tracks) {
    if (tr.t < now - 0.05) tr.t = now + 0.02;
    while (tr.t < ahead) {
      const [m, d] = tr.notes[tr.i]; const dur = d * tr.e8;
      if (m) tone(midi(m), tr.t, dur * 0.88, tr.type, tr.v, bgmGain);
      tr.t += dur; tr.i = (tr.i + 1) % tr.notes.length;
    }
  }
}, 50);
function setMute(m) { muted = m; if (master) master.gain.value = m ? 0 : 0.6; }

// ================= ドット絵 =================

let fade = null, encT = 0, encEnemy = null;
function fadeTo(mid, dur = 18, after) { fade = { t: 0, dur, mid, after, done: false }; }

  if (chestAt(x, y)) return true;
  const n = npcAt(x, y); if (n && n !== self) return true;
  if (bigAt(x, y) && (!self || !self.big)) return true;
  if (self && ((pl.x === x && pl.y === y) || (pl.moving && pl.tx === x && pl.ty === y))) return true;
  return false;
}

function startNpcMove(n, d) { const [dx, dy] = DV[d]; n.dir = d; if (blocked(n.x + dx, n.y + dy, n)) return false; n.tx = n.x + dx; n.ty = n.y + dy; n.moving = true; return true; }

  for (const n of activeNpcs()) {
    if (n.moving) {
      n.px += Math.sign(n.tx * TS - n.px); n.py += Math.sign(n.ty * TS - n.py);
      if (n.px === n.tx * TS && n.py === n.ty * TS) { n.x = n.tx; n.y = n.ty; n.moving = false; if (n.id === 'guard') n.dir = 'down'; }
    } else if (n.wander && !ui.length && --n.wt <= 0) {
      n.wt = ri(70, 200); const d = ['up', 'down', 'left', 'right'][ri(0, 3)]; const [dx, dy] = DV[d]; const [x0, y0, x1, y1] = n.wander;
      const tx = n.x + dx, ty = n.y + dy; if (tx >= x0 && tx <= x1 && ty >= y0 && ty <= y1) startNpcMove(n, d); else n.dir = d;
    }
  }
}

  if (t === '.') return pl.y < 19 ? ['A', 1 / 22] : ['B', 1 / 16];
  if (t === '"') return pl.y < 19 ? ['B', 1 / 11] : ['C', 1 / 10];
  return null;
}

let battle = null;

function commandPhase() {

  m.onSelect = i => { if (i === 0) { ui = []; doTurn({ t: 'atk' }); } if (i === 1) spellMenu(true); if (i === 2) itemMenu(true); if (i === 3) { ui = []; doTurn({ t: 'run' }); } };

function dmgCalc(atk, def) { const d = Math.floor((atk - def / 2) * (0.55 + rnd() * 0.25)); return d >= 1 ? d : (rnd() < 0.5 ? 1 : 0); }
function doTurn(act) {

}
function check() {

}
function heroAct(a) {

    if (d > 0) msg(`${e.name}に ${d}の ダメージ！`, () => { e.hp = Math.max(0, e.hp - d); b.flash = 18; sfx('hit'); });

function enemyAct() {

  const hurt = d => () => { hero.hp = Math.max(0, hero.hp - d); b.shake = 14; b.red = 10; sfx('hurt'); buzz(40); };

// ================= 独立したSRPG訓練 =================
let tactical, tacticalCursor, tacticalText, enemyQueue, enemyDelay;
const TX=20, TY=24, CELL=20;
function startTactics() {
  tactical=new DQTactics.Battle(); tacticalCursor={x:1,y:3};
  tacticalText='青マスへ移動 → 赤い敵へ攻撃';
  enemyQueue=[];enemyDelay=0;ui=[];scene='tactics';playBGM('battle');
}
function leaveTactics(){scene='title';ui=[];stopBGM();openTitleMenu();}
function finishTactics(){
  if(!tactical.result)return false;
  tacticalText=tactical.result==='victory'?'勝利！ Aで再挑戦 / Bで戻る':'敗北… Aで再挑戦 / Bで戻る';
  stopBGM();sfx(tactical.result==='victory'?'win':'dead');return true;
}
function scheduleEnemies(){
  if(finishTactics())return;
  enemyQueue=tactical.alive.filter(u=>u.team==='enemy').map(u=>u.id);enemyDelay=36;
}
function tacticalAction(x,y){
  if(tactical.phase!=='player')return;
  tacticalCursor={x,y};
  const enemy=tactical.alive.find(u=>u.team==='enemy'&&u.x===x&&u.y===y);
  if(enemy){
    const damage=tactical.attack(enemy.id);
    if(damage===null){tacticalText='射程外！ 隣のマスへ近づこう';sfx('bump');return;}
    tacticalText=enemy.name+'に '+damage+' ダメージ！';sfx('hit');scheduleEnemies();
  }else if(x===tactical.hero.x&&y===tactical.hero.y){
    tactical.wait();tacticalText='待機。敵のターン';scheduleEnemies();
  }else if(tactical.move(x,y)){tacticalText='隣の敵を攻撃 / 自分を選んで待機';sfx('ok');}
  else{tacticalText=tactical.moved?'移動済み。攻撃か待機を選ぼう':'そこへは移動できない';sfx('bump');}
}
function updateTactics(){
  if(inp.p.b){leaveTactics();return;}
  if(tactical.result){if(inp.p.a)startTactics();return;}
  if(tactical.phase==='enemy'){
    if(--enemyDelay>0)return;
    const id=enemyQueue.shift();
    if(id){const action=tactical.enemyAct(id);if(action){tacticalText=action.unit.name+(action.damage?'の攻撃！ '+action.damage+' ダメージ':'が移動した');sfx(action.damage?'hurt':'cur');}enemyDelay=36;finishTactics();}
    else{tactical.nextTurn();tacticalCursor={x:tactical.hero.x,y:tactical.hero.y};tacticalText='青マスへ移動 / 自分を選んで待機';}
    return;
  }
  for(const d of ['up','down','left','right'])if(rep(d)){const [dx,dy]=DV[d];tacticalCursor.x=clamp(tacticalCursor.x+dx,0,9);tacticalCursor.y=clamp(tacticalCursor.y+dy,0,5);sfx('cur');}
  if(inp.p.a)tacticalAction(tacticalCursor.x,tacticalCursor.y);
}
function drawTactics(){
  lx.fillStyle='#101829';lx.fillRect(0,0,BW,BH);
  const reach=tactical.phase==='player'&&!tactical.moved?tactical.reachable(tactical.hero):[];
  for(let y=0;y<6;y++)for(let x=0;x<10;x++){
    const px=TX+x*CELL,py=TY+y*CELL;
    lx.drawImage(tileImg(tactical.map[y][x]==='#'?'X':'.',0,0),px,py,CELL,CELL);
    if(reach.some(p=>p.x===x&&p.y===y)){lx.fillStyle='rgba(30,160,255,.4)';lx.fillRect(px,py,CELL,CELL);}
    lx.strokeStyle='#253b36';lx.strokeRect(px+.5,py+.5,CELL-1,CELL-1);
  }
  for(const u of tactical.alive){
    const px=TX+u.x*CELL,py=TY+u.y*CELL;
    if(u.team==='player')lx.drawImage(SPR.hero.down[(frame>>4)%2],px+2,py+1);
    else lx.drawImage(ENEMIES[u.sprite].img,px+2,py+1,16,16);
    lx.fillStyle='#111';lx.fillRect(px+2,py+17,16,2);lx.fillStyle=u.team==='player'?'#5de6ff':'#ff7474';lx.fillRect(px+2,py+17,16*u.hp/u.maxHp,2);
    if(tactical.phase==='player'&&tactical.canAttack(tactical.hero,u)){lx.strokeStyle='#ff7474';lx.strokeRect(px+1,py+1,18,18);}
  }
  lx.strokeStyle='#ffe070';lx.strokeRect(TX+tacticalCursor.x*CELL+1,TY+tacticalCursor.y*CELL+1,18,18);
}
function drawTacticsUI(){
  txt('訓練 '+tactical.turn+' / '+(tactical.phase==='enemy'?'敵のターン':'勇者のターン'),8,5,9,'#ffe070');
  txt('HP '+tactical.hero.hp+'/32',BW-8,5,9,'#8ee8ff','right');
  txt(tacticalText,BW/2,147,9,'#fff','center');
  txt('移動3・射程1 / B:戻る',8,163,8,'#aaa');
  const label=tactical.result?'再挑戦':'待機';
  win(176,158,60,18);txt(label,206,162,9,'#ffe070','center');
  addHit(176,158,60,18,()=>{if(tactical.result)startTactics();else if(tactical.wait()){tacticalText='待機。敵のターン';scheduleEnemies();}});
  if(tactical.phase==='player')for(let y=0;y<6;y++)for(let x=0;x<10;x++)addHit(TX+x*CELL,TY+y*CELL,CELL,CELL,()=>tacticalAction(x,y));
  if(tactical.result)addHit(TX,TY,200,120,startTactics);
}

// ================= タイトル / エンディング =================
let scene = 'title';
const stars = Array.from({ length: 60 }, (_, i) => [hash(i, 1) % BW, hash(i, 2) % 110, hash(i, 3) % 3]);
function openTitleMenu() {
  ui = [];
  const m = new Menu({ items: [{ label: 'はじめから' }, { label: 'つづきから', dis: !hasSave() }, { label: 'SRPGおためし' }], w: 140, ih: 19, size: 12 });
  m.x = (BW - m.w) / 2; m.y = 100; m.cur = hasSave() ? 1 : 0;
  m.onSelect = i => {
    if (i === 2) { startTactics(); return; }
    if (i === 0) newGame(); else load();
    ui = [];
    fadeTo(() => { scene = 'field'; playBGM(curMap === 'cave' ? 'cave' : 'field'); }, 18, () => {
      if (i === 0) say([isTouch ? '【そうさ】 ひだりの 十字ボタンで いどう。 Ⓐで はなす・しらべる・けってい、Ⓑで メニュー・もどる。 メニューや コマンドは がめんを タップしても えらべるよ。'
        : '【そうさ】 やじるしキーで いどう。 Z / Enterで けってい、X / Escで メニュー・もどる。 がめんの メニューは クリックでも えらべます。',
        'まずは 目の前の 村長に はなしかけよう！']);
    });
  };
  pushUI(m);
}
function drawTitleLo() {
  const g = lx.createLinearGradient(0, 0, 0, BH); g.addColorStop(0, '#0a0a2a'); g.addColorStop(0.7, '#3a2a6a'); g.addColorStop(1, '#6a3a5a');
  lx.fillStyle = g; lx.fillRect(0, 0, BW, BH);
  for (const [x, y, s] of stars) { lx.fillStyle = (frame + x) % 90 < 6 ? '#fff' : ['#8888cc', '#bbbbff', '#ffffff'][s]; lx.fillRect(x, y, 1, 1); }
  lx.fillStyle = '#1a1430'; for (let x = 0; x < BW; x++) { const hgt = 30 + Math.abs(((x * 3) % 90) - 45) * 0.6 + (x % 7); lx.fillRect(x, BH - hgt, 1, hgt); }
  lx.fillStyle = '#0e0a1e'; lx.fillRect(0, BH - 22, BW, 22);
  drawChar(SPR.hero, 'right', (frame >> 4) % 2, 40, BH - 38);
  lx.drawImage(ENEMIES.slime.img, 176, BH - 36 + (((frame >> 3) % 4) === 0 ? -2 : 0));
  lx.drawImage(DRAGON_MAP, 184, 70, 44, 44);
}
function drawTitleUI() {
  ctx.save(); ctx.shadowColor = '#000'; ctx.shadowOffsetY = 2;
  txt('ドット・クエスト', BW / 2, 30, 24, '#ffe070', 'center'); txt('〜 ちいさな勇者と ドラゴン 〜', BW / 2, 62, 10, '#e0d8ff', 'center'); ctx.restore();
  if (!ui.length && !fade) txt(isTouch ? 'タップして スタート' : 'クリック / キーで スタート', BW / 2, 112, 11, (frame >> 5) % 2 ? '#fff' : '#aaa', 'center');
  txt(isTouch ? 'Ⓐ けってい ・ Ⓑ もどる/メニュー' : '←↑↓→ いどう ・ Z けってい ・ X もどる', BW / 2, BH - 13, 8, '#c8c0e8', 'center');
}
let endT = 0;
function toEnding() { stopBGM(); fadeTo(() => { scene = 'ending'; endT = 0; ui = []; save(); playBGM('ending'); }, 40); }
function drawEnding() {
  lx.fillStyle = '#060614'; lx.fillRect(0, 0, BW, BH);
  for (const [x, y, s] of stars) { lx.fillStyle = ['#666699', '#aaaaee', '#ffffff'][s]; lx.fillRect(x, (y + (frame >> 3)) % BH, 1, 1); }
  drawChar(SPR.hero, 'down', (frame >> 4) % 2, 80, 120); drawChar(SPR.elder, 'down', (frame >> 4) % 2, 112, 120); drawChar(SPR.girl, 'down', (frame >> 4) % 2, 144, 120);
}
function drawEndingUI() {
  ctx.globalAlpha = Math.min(1, endT / 60);
  txt('THE END', BW / 2, 24, 22, '#ffe070', 'center');
  txt('ドラゴンは たおされ、', BW / 2, 58, 11, '#fff', 'center');
  txt('ミルフィの村に へいわが もどった。', BW / 2, 74, 11, '#fff', 'center');
  txt(`ゆうしゃ Lv${hero.lv} ・ ${WEAPONS[hero.weapon].name}`, BW / 2, 96, 10, '#bfc4ff', 'center');
  if (endT > 120 && (frame >> 5) % 2) txt('Ⓐ / タップで タイトルへ', BW / 2, BH - 18, 10, '#ddd', 'center');
  ctx.globalAlpha = 1;
}

// ================= ループ =================
function update() {
  frame++;
  beginFrame();
  if (fade) {
    fade.t++;
    if (!fade.done && fade.t >= fade.dur) { fade.done = true; if (fade.mid) fade.mid(); }
    if (fade.t >= fade.dur * 2) { const a = fade.after; fade = null; if (a) a(); }
    if (scene === 'field') updateNpcs();
    return;
  }
  const top = topUI();
  if (scene === 'title') { if (top) top.update(); else if (inp.p.a || inp.p.b) { sfx('ok'); openTitleMenu(); } return; }
  if (scene === 'ending') { endT++; if (endT > 120 && inp.p.a) { stopBGM(); fadeTo(() => { scene = 'title'; ui = []; }, 30); } return; }
  if (scene === 'tactics') { updateTactics(); return; }
  if (scene === 'battle') { if (top) top.update(); updateBattle(); return; }
  if (scene === 'field') { if (top) { updateNpcs(); top.update(); } else updateField(); }
}
function render() {
  hits = [];
  if (scene === 'title') drawTitleLo();
  else if (scene === 'tactics') drawTactics();
  else if (scene === 'field') drawField();
  else if (scene === 'battle') drawBattle();
  else if (scene === 'ending') drawEnding();
  // 低解像度レイヤーをニアレストネイバーで拡大（ドットくっきり）
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, cvs.width, cvs.height);
  let ox = 0, oy = 0;
  if (scene === 'battle' && battle.shake > 0) { ox = Math.round(ri(-3, 3) * S); oy = Math.round(ri(-2, 2) * S); }
  ctx.drawImage(lo, 0, 0, BW, BH, ox, oy, cvs.width, cvs.height);
  // 文字・ウィンドウは実解像度で描画（にじまない）
  ctx.setTransform(S, 0, 0, S, 0, 0);
  if (scene === 'battle') { if (battle.red > 0) { ctx.fillStyle = `rgba(255,0,0,${battle.red * 0.03})`; ctx.fillRect(0, 0, BW, BH); } drawBattleUI(); }
  if (scene === 'tactics') drawTacticsUI();
  if (scene === 'field') drawFieldHUD();
  if (scene === 'title') drawTitleUI();
  if (scene === 'ending') drawEndingUI();
  ui.forEach((o, i) => o.draw(i === ui.length - 1 && !fade));
  if (scene === 'title' && !ui.length && !fade) addHit(0, 0, BW, BH, () => { sfx('ok'); openTitleMenu(); });
  if (fade) { const a = fade.t < fade.dur ? fade.t / fade.dur : 1 - (fade.t - fade.dur) / fade.dur; ctx.fillStyle = `rgba(0,0,0,${clamp(a, 0, 1)})`; ctx.fillRect(0, 0, BW, BH); }
}
let last = performance.now(), acc = 0;
function loop(now) {
  acc += Math.min(100, now - last); last = now;
  let n = 0; while (acc >= 1000 / 60 && n < 4) { update(); acc -= 1000 / 60; n++; }
  render();
  requestAnimationFrame(loop);
}
layout(); setTimeout(layout, 300);
requestAnimationFrame(loop);
// テスト用フック
window.__dq = { startTactics, get tactics() { return tactical; }, get scene() { return scene; }, get hero() { return hero; }, get pl() { return pl; }, get ui() { return ui; }, get battle() { return battle; }, get map() { return curMap; },
  get flags() { return flags; }, get audio() { return ac ? ac.state : 'none'; }, get S() { return S; }, MAPS, CHESTS, npcs: () => npcs,
  startBattle, warp(m, x, y, d = 'down') { curMap = m; pl = mkPlayer(x, y, d); } };
})();
</script>
